# T-12 mitigation: All secret values are ${VAR} references only.
# Real values live in .env (git-ignored). .env.example ships safe placeholders.
# drizzle-kit push is NEVER used — migrator always runs drizzle-kit migrate.

services:
  # ─── Postgres 17 ─────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: budget
      # PC-19: password env vars forwarded to 00-roles.sh for NOBYPASSRLS role creation (T-3)
      APP_ROLE_PASSWORD: ${APP_ROLE_PASSWORD}
      WORKER_ROLE_PASSWORD: ${WORKER_ROLE_PASSWORD}
      MIGRATOR_ROLE_PASSWORD: ${MIGRATOR_ROLE_PASSWORD}
    volumes:
      # Persistent data → bind mount OUTSIDE repo (postgres chowns to uid 70:70
      # which then breaks Docker build context reads if kept inside the repo).
      # Override with POSTGRES_DATA_PATH env var; default sibling path keeps it
      # outside the build context.
      - ${POSTGRES_DATA_PATH:-../budget-data/postgres}:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      # SEC: bind to loopback only. "5432:5432" publishes on 0.0.0.0 (every host
      # interface) — on a host without an external firewall that exposes Postgres
      # to the LAN/internet, guarded only by role passwords. 127.0.0.1 keeps the
      # port reachable for local psql + CI (which connects host→localhost:5432,
      # ci.yml migration step) while removing all off-host exposure. Prod
      # api/worker/migrator reach the DB over the compose network (@db:5432),
      # never via the host, so nothing production needs this mapping.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budget"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 5s
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  # ─── Migrator (one-shot) ──────────────────────────────────────────────────────
  # D-18: runs drizzle-kit migrate (NEVER push) + post-migration.sql
  # Uses pg_advisory_lock to prevent concurrent runs (Pitfall 1).
  migrator:
    build:
      context: .
      dockerfile: apps/migrator/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL_MIGRATOR: ${DATABASE_URL_MIGRATOR}
    depends_on:
      db:
        condition: service_healthy

  # ─── API (Hono / Bun) ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL_APP: ${DATABASE_URL_APP}
      # Tracing is opt-in: unset -> startTracing() is a no-op, so the default
      # `make dev` stack is untouched. Set it (compose profile `obs` provides
      # the collector) to start exporting spans.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BUDGET_KEK: ${BUDGET_KEK}
      APP_URL: ${APP_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      # Web push (server-side web-push signing). Without these the push send
      # throws "VAPID_SUBJECT, VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY must be set".
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      # Phase 9: investments price-provider keys (on-add instant fetch). Each
      # *_API_KEYS accepts a comma-separated list for round-robin failover.
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FINNHUB_API_KEYS: ${FINNHUB_API_KEYS:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      TWELVE_DATA_API_KEYS: ${TWELVE_DATA_API_KEYS:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINGECKO_API_KEYS: ${COINGECKO_API_KEYS:-}
      METALS_DEV_API_KEY: ${METALS_DEV_API_KEY:-}
      OTEL_SERVICE_NAME: api
      # DEV-ONLY: opt in to the gated test clock (POST /test/clock). Combined with
      # the absence of NODE_ENV=production, this lets the E2E reserve golden walk
      # move the server clock May→June. Prod images/compose never set this, so the
      # endpoint 404s and serverNow() is always the real clock there.
      ALLOW_TEST_CLOCK: "1"
      # Demo account (Phase 12). All optional: with these unset the worker
      # registers no refresh job, /demo is a 404, and demoGuard is a no-op.
      DEMO_SOURCE_TENANT_IDS: ${DEMO_SOURCE_TENANT_IDS:-}
      DEMO_TENANT_IDS: ${DEMO_TENANT_IDS:-}
      DEMO_USER_ID: ${DEMO_USER_ID:-}
      DEMO_SECOND_USER_ID: ${DEMO_SECOND_USER_ID:-}
      DEMO_CURRENCIES: ${DEMO_CURRENCIES:-}
      DEMO_BUDGET_NAMES: ${DEMO_BUDGET_NAMES:-}
      DEMO_LABELS: ${DEMO_LABELS:-}
      DEMO_HOME_CURRENCY: ${DEMO_HOME_CURRENCY:-}
      DEMO_SHARED_LABELS: ${DEMO_SHARED_LABELS:-}
      DEMO_LOCALES: ${DEMO_LOCALES:-}
      DEMO_TENANT_IDS_EN: ${DEMO_TENANT_IDS_EN:-}
      DEMO_USER_ID_EN: ${DEMO_USER_ID_EN:-}
      DEMO_SECOND_USER_ID_EN: ${DEMO_SECOND_USER_ID_EN:-}
      DEMO_TENANT_IDS_PL: ${DEMO_TENANT_IDS_PL:-}
      DEMO_USER_ID_PL: ${DEMO_USER_ID_PL:-}
      DEMO_SECOND_USER_ID_PL: ${DEMO_SECOND_USER_ID_PL:-}
      DEMO_TENANT_IDS_UK: ${DEMO_TENANT_IDS_UK:-}
      DEMO_USER_ID_UK: ${DEMO_USER_ID_UK:-}
      DEMO_SECOND_USER_ID_UK: ${DEMO_SECOND_USER_ID_UK:-}
      DEMO_CURRENCIES_EN: ${DEMO_CURRENCIES_EN:-}
      DEMO_CURRENCIES_PL: ${DEMO_CURRENCIES_PL:-}
      DEMO_CURRENCIES_UK: ${DEMO_CURRENCIES_UK:-}
      # CI E2E ONLY: forwarded from .env so the e2e job can disable Better Auth's
      # rate limiter (the suite's ~800 fresh-user sign-ups across 6 viewport
      # projects otherwise get throttled by the 100/60s bucket). Defaults to empty
      # (limiter stays ENABLED) in dev/prod, where the var is unset.
      AUTH_RATE_LIMIT_DISABLED: ${AUTH_RATE_LIMIT_DISABLED:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    # NOTE: api intentionally NOT published to host. Public access is via
    # the web container (port 3000), which rewrites /auth/* and /api/auth/*
    # to http://api:4000 over the internal docker network.
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ─── Web (Next.js) ────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the client bundle so pushManager.subscribe has a real
        # applicationServerKey. Sourced from the (infisical) env at build time;
        # empty when unset → push stays unavailable. MUST equal the server's
        # VAPID_PUBLIC_KEY so delivered pushes validate.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    environment:
      # Tracing is opt-in: unset -> register() is a no-op, so the default
      # `make dev` stack is untouched. `make obs-up` sets it.
      #
      # web needs this as much as api does: a 3.71s document could not be
      # explained because this tier emitted nothing (260827).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # NEXT_PUBLIC_* is inlined at BUILD time. For server-side fetches that must
      # resolve at runtime (RSC server actions calling http://api:4000) we set a
      # separate non-public var that stays a runtime lookup.
      NEXT_PUBLIC_API_URL: http://api:4000
      API_INTERNAL_URL: http://api:4000
      # Demo account (Phase 12). DEMO_EMAIL/PASSWORD are read ONLY by the
      # server-side /demo route handler and never reach the client bundle.
      DEMO_USER_ID: ${DEMO_USER_ID:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_USER_ID_EN: ${DEMO_USER_ID_EN:-}
      DEMO_USER_ID_PL: ${DEMO_USER_ID_PL:-}
      DEMO_USER_ID_UK: ${DEMO_USER_ID_UK:-}
      DEMO_SECOND_USER_ID_EN: ${DEMO_SECOND_USER_ID_EN:-}
      DEMO_SECOND_USER_ID_PL: ${DEMO_SECOND_USER_ID_PL:-}
      DEMO_SECOND_USER_ID_UK: ${DEMO_SECOND_USER_ID_UK:-}
      DEMO_CURRENCIES_EN: ${DEMO_CURRENCIES_EN:-}
      DEMO_CURRENCIES_PL: ${DEMO_CURRENCIES_PL:-}
      DEMO_CURRENCIES_UK: ${DEMO_CURRENCIES_UK:-}
      DEMO_EMAIL_EN: ${DEMO_EMAIL_EN:-}
      DEMO_PASSWORD_EN: ${DEMO_PASSWORD_EN:-}
      DEMO_EMAIL_PL: ${DEMO_EMAIL_PL:-}
      DEMO_PASSWORD_PL: ${DEMO_PASSWORD_PL:-}
      DEMO_EMAIL_UK: ${DEMO_EMAIL_UK:-}
      DEMO_PASSWORD_UK: ${DEMO_PASSWORD_UK:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/en/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── Worker (pg-boss background jobs) ────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER}
      # Phase 7: the hourly budgeting-reconciliation sweep runs the RESERVE_TOPUP /
      # CUSHION_BELOW_TARGET task generators inside withTenantTx(SYSTEM_USER), which
      # uses the APP pool (sets per-tenant app.tenant_ids RLS GUC). Without this var
      # the sweep throws "Missing required env var: DATABASE_URL_APP" on every tenant
      # and stale tasks never self-heal. The write-path inline hooks live in `api`;
      # this is the worker-side backstop. (worker is workerDb for its own jobs.)
      DATABASE_URL_APP: ${DATABASE_URL_APP}
      # Tracing is opt-in: unset -> startTracing() is a no-op, so the default
      # `make dev` stack is untouched. Set it (compose profile `obs` provides
      # the collector) to start exporting spans.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: worker
      BUDGET_KEK: ${BUDGET_KEK}
      # Web push: the pg-boss notification worker signs/sends pushes via web-push.
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      # Phase 9: price-scan cadence (UTC cron) + provider keys (CSV failover).
      PRICE_SCAN_CRON: "${PRICE_SCAN_CRON:-0 * * * *}"
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FINNHUB_API_KEYS: ${FINNHUB_API_KEYS:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      TWELVE_DATA_API_KEYS: ${TWELVE_DATA_API_KEYS:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINGECKO_API_KEYS: ${COINGECKO_API_KEYS:-}
      METALS_DEV_API_KEY: ${METALS_DEV_API_KEY:-}
      # Demo account (Phase 12). All optional: with these unset the worker
      # registers no refresh job, /demo is a 404, and demoGuard is a no-op.
      DEMO_SOURCE_TENANT_IDS: ${DEMO_SOURCE_TENANT_IDS:-}
      DEMO_TENANT_IDS: ${DEMO_TENANT_IDS:-}
      DEMO_USER_ID: ${DEMO_USER_ID:-}
      DEMO_SECOND_USER_ID: ${DEMO_SECOND_USER_ID:-}
      DEMO_CURRENCIES: ${DEMO_CURRENCIES:-}
      DEMO_BUDGET_NAMES: ${DEMO_BUDGET_NAMES:-}
      DEMO_LABELS: ${DEMO_LABELS:-}
      DEMO_HOME_CURRENCY: ${DEMO_HOME_CURRENCY:-}
      DEMO_SHARED_LABELS: ${DEMO_SHARED_LABELS:-}
      DEMO_LOCALES: ${DEMO_LOCALES:-}
      DEMO_TENANT_IDS_EN: ${DEMO_TENANT_IDS_EN:-}
      DEMO_USER_ID_EN: ${DEMO_USER_ID_EN:-}
      DEMO_SECOND_USER_ID_EN: ${DEMO_SECOND_USER_ID_EN:-}
      DEMO_TENANT_IDS_PL: ${DEMO_TENANT_IDS_PL:-}
      DEMO_USER_ID_PL: ${DEMO_USER_ID_PL:-}
      DEMO_SECOND_USER_ID_PL: ${DEMO_SECOND_USER_ID_PL:-}
      DEMO_TENANT_IDS_UK: ${DEMO_TENANT_IDS_UK:-}
      DEMO_USER_ID_UK: ${DEMO_USER_ID_UK:-}
      DEMO_SECOND_USER_ID_UK: ${DEMO_SECOND_USER_ID_UK:-}
      DEMO_CURRENCIES_EN: ${DEMO_CURRENCIES_EN:-}
      DEMO_CURRENCIES_PL: ${DEMO_CURRENCIES_PL:-}
      DEMO_CURRENCIES_UK: ${DEMO_CURRENCIES_UK:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy


  # ─── Observability (opt-in) ───────────────────────────────────────────────────
  # Not started by `make dev`. Bring up with `make obs-up`, which also sets
  # OTEL_EXPORTER_OTLP_ENDPOINT so api/worker begin exporting.
  #
  # api/worker → this collector (over the default network) → SigNoz's ingester
  # (over signoz-network), with every span also printed to this collector's log.
  # See infra/observability/otel-collector.yaml for why the log stays.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    profiles: ["obs"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      # BOTH, explicitly: naming any network opts a service OUT of the default
      # one, and losing `default` would cut it off from api and worker.
      - default
      - signoz-network
    ports:
      # 1431x, NOT 4317/4318: SigNoz's own ingester already binds those on this
      # host, so the standard pair made `make obs-up` die with "port is already
      # allocated" — which read as "tracing is off" for as long as SigNoz was
      # installed (260827). Nothing depends on the host mapping; api and worker
      # reach the collector by service name. It is here for host-side probing.
      #
      # Loopback only — an OTLP receiver on 0.0.0.0 accepts telemetry from
      # anything that can reach the host.
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:14317:4317"

  # ─── Backups (hourly pg_dump → age → Cloudflare R2) ──────────────────────────
  # Holds the age PUBLIC key only: this container writes backups it cannot read.
  # The private half is injected at run time by `make restore-check` and never
  # lives in a long-running process.
  backup:
    build:
      context: ./infra/backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: budget
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      # EU-jurisdiction buckets answer ONLY at the .eu. host; the global one
      # returns 403 AccessDenied, which looks exactly like a bad token.
      R2_JURISDICTION: ${R2_JURISDICTION:-eu.}
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY}
      BACKUP_CRON: ${BACKUP_CRON:-0 * * * *}
      BACKUP_ALERT_WEBHOOK: ${BACKUP_ALERT_WEBHOOK:-}

networks:
  # SigNoz runs as its OWN compose project (infra/observability/signoz), so its
  # network is external here. Only otel-collector joins it, and only under the
  # `obs` profile — `make dev` never touches it, so a machine without SigNoz is
  # unaffected.
  signoz-network:
    external: true
