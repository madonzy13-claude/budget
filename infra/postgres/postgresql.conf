# Dev Postgres configuration — observability tuned for local development.
# Mounted read-only at /etc/postgresql/postgresql.conf in docker-compose.yml.

# Logging: capture all DDL for dev debugging
log_statement = 'ddl'
log_min_duration_statement = 200

# Performance observability
# NOTE: preloading pg_stat_statements only collects the counters; the readable
# view comes from CREATE EXTENSION (infra/postgres/init/04-extensions.sql).
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = 'all'

# auto_explain: anything slower than log_min_duration_statement gets its PLAN
# logged next to it, so a slow query arrives already explained instead of needing
# a manual EXPLAIN against different data. Dev-only settings — log_analyze runs
# the query with instrumentation, which is real overhead and must not ship to prod.
auto_explain.log_min_duration = '200ms'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_nested_statements = on
auto_explain.log_format = 'text'

# Connection settings
listen_addresses = '*'
max_connections = 100

# Reasonable timeouts for dev
lock_timeout = '10s'
idle_in_transaction_session_timeout = '30s'
