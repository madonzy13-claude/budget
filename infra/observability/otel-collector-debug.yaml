# Minimal OTLP collector that just prints what it receives.
#
# Purpose: prove the instrumentation end-to-end (Bun -> OTLP -> spans, with pg
# queries nested under the request span) WITHOUT paying for ClickHouse. If this
# shows a correct trace tree, the exporter is a swap of one endpoint away; if it
# doesn't, no dashboard would have helped.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s

exporters:
  # verbosity: detailed prints every span with its attributes, parent id and
  # timings — which is exactly what we need to assert nesting.
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
  telemetry:
    logs:
      # MUST be info: the debug exporter writes spans through the collector's
      # own logger at info level, so `warn` silently swallows every trace and
      # the log looks identical to "nothing was received".
      level: info
