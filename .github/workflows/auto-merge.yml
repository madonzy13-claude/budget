name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `next` and `better-auth` are PINNED in the root package.json
      # `overrides` block, so a dependabot bump edits the manifests without
      # changing a single resolved version — CI goes green having tested
      # nothing. Both were auto-merged that way on 2026-08-28 and both are
      # held back for a measured reason (see CLAUDE.md, Held-back versions).
      # Their PRs still open; a human lifts the override and re-checks the gate.
      - name: Comment on a pinned dependency instead of merging
        if: |
          contains(format(',{0},', steps.meta.outputs.dependency-names), ',next,') ||
          contains(format(',{0},', steps.meta.outputs.dependency-names), ',better-auth,')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" \
            --body "\`${{ steps.meta.outputs.dependency-names }}\` is pinned in the root \`overrides\` block. Merging this changes the manifest but not the installed version, so CI proves nothing. Lift the override and re-run the documented gate (CLAUDE.md → Held-back versions) before merging."

      - name: Enable auto-merge for patch + minor updates
        if: |
          (
            steps.meta.outputs.update-type == 'version-update:semver-patch' ||
            steps.meta.outputs.update-type == 'version-update:semver-minor'
          ) &&
          !contains(format(',{0},', steps.meta.outputs.dependency-names), ',next,') &&
          !contains(format(',{0},', steps.meta.outputs.dependency-names), ',better-auth,')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Comment on major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" \
            --body "Major version bump (\`${{ steps.meta.outputs.dependency-name }}\` ${{ steps.meta.outputs.previous-version }} -> ${{ steps.meta.outputs.new-version }}). Auto-merge withheld pending manual review."
